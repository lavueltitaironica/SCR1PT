name: Generar catalogo SCR1PT

on:
  push:
    branches:
      - main
    paths:
      - 'SCR1PT/**/*.ps1'
      - 'tools/Build-Catalog.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generar catalog.json
        shell: pwsh
        run: ./tools/Build-Catalog.ps1

      - name: Publicar catalogo si ha cambiado
        shell: pwsh
        run: |
          $status = @(git status --porcelain -- catalog.json)

          if ($status.Count -eq 0) {
            Write-Host 'catalog.json ya esta actualizado.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m 'chore: actualizar catalogo SCR1PT [skip ci]'
          git push
